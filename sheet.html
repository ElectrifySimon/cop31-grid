<!doctype html><html><head><meta charset="utf-8"><style>
:root{--ink:#111;--mut:#6b7280}
*{box-sizing:border-box}
body{margin:0;background:#0d0f12;color:#e9eef5;font:14px/1.4 ui-sans-serif,system-ui,sans-serif;padding:28px}
h1{font:600 15px/1 ui-monospace,monospace;letter-spacing:.18em;text-transform:uppercase;color:#8b98a8;margin:0 0 18px}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-bottom:30px}
figure{margin:0}
figure img{width:100%;display:block;border-radius:12px;border:1px solid #222833;box-shadow:0 20px 50px rgba(0,0,0,.55)}
figcaption{margin-top:10px;font:600 11px/1.5 ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;color:#93a1b3}
figcaption b{color:#fff;display:block;font-size:12.5px;letter-spacing:.06em;margin-bottom:3px}
</style></head><body>
<h1>COP31 public page, three directions</h1>
<div class="row">
  <figure><img src="mock-A-m.png"><figcaption><b>A · Warm paper, soft depth</b>serif, layered surfaces, green and gold</figcaption></figure>
  <figure><img src="mock-B-m.png"><figcaption><b>B · Night glass</b>dark canvas, frosted panels, glow accents</figcaption></figure>
  <figure><img src="mock-C-m.png"><figcaption><b>C · Product modern</b>neutral, cards, elevation, blue and amber</figcaption></figure>
</div>
<div class="row">
  <figure><img src="mock-A-t.png"><figcaption><b>A · tablet</b></figcaption></figure>
  <figure><img src="mock-B-t.png"><figcaption><b>B · tablet</b></figcaption></figure>
  <figure><img src="mock-C-t.png"><figcaption><b>C · tablet</b></figcaption></figure>
</div>
</body></html>
