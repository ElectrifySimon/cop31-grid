<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#0d0f12;color:#e9eef5;font:14px/1.4 ui-sans-serif,system-ui,sans-serif;padding:26px}
h1{font:600 14px/1 ui-monospace,monospace;letter-spacing:.2em;text-transform:uppercase;color:#8b98a8;margin:0 0 16px}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
figure{margin:0}
img{width:100%;display:block;border-radius:12px;border:1px solid #222833;box-shadow:0 20px 50px rgba(0,0,0,.55)}
figcaption{margin-top:10px;font:600 11px/1.5 ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;color:#93a1b3}
figcaption b{display:block;color:#fff;font-size:12.5px;letter-spacing:.06em;margin-bottom:3px}
</style></head><body>
<h1>COP31 header, three treatments on direction A</h1>
<div class="row">
<figure><img src="hdr-H1-m.png"><figcaption><b>H1 · Chronograph</b>live Antalya clock, 24h session ribbon, now cursor</figcaption></figure>
<figure><img src="hdr-H2-m.png"><figcaption><b>H2 · Nameplate</b>masthead rules, ghost day numeral, colophon row</figcaption></figure>
<figure><img src="hdr-H3-m.png"><figcaption><b>H3 · Pass</b>ticket stub, perforation, actions in the tear-off</figcaption></figure>
</div></body></html>
